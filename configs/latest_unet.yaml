# ============================================================================
# Latest UNet — 14 classes (incl. Vimentin), jitter=48, Dice-based early stopping
# ============================================================================
# Corresponds to the original latest_baseline.py
# Key differences from base: 14 classes, stride-1 first layer, grad accumulation,
# Dice-based scheduling/early-stopping, crop234 exclusion
inherits: base.yaml

experiment_name: latest-unet-14cls-jitter48-dice

data:
  patch_dim: 128
  max_jitter: 48
  seed: 42
  num_classes: 30          # Background (0) + 29 atomic semantic classes (1..29)
  target_classes:
    - pm
    - mito_mem
    - mito_lum
    - mito_ribo
    - golgi_mem
    - golgi_lum
    - ves_mem
    - ves_lum
    - endo_mem
    - endo_lum
    - lyso_mem
    - lyso_lum
    - ld_mem
    - ld_lum
    - er_mem
    - er_lum
    - eres_mem
    - eres_lum
    - ne_mem
    - ne_lum
    - np_out
    - np_in
    - hchrom
    - echrom
    - nucpl
    - mt_out
    - mt_in
    - perox_mem
    - perox_lum
  train_json: train_anchore.json
  val_json: val_anchore.json
  test_json: test_anchore.json

model:
  out_channels: 30
  strides: [2, 2, 2, 2]

training:
  batch_size: 4
  accumulation_steps: 2
  early_stop_patience: 15
  early_stop_metric: val_dice
  scheduler_mode: max
  print_freq: 200
  num_epochs: 100
