# ============================================================================
# Camera-Ready UNet — 30 classes (Atomic Organelles + Background), dynamic patches
# ============================================================================
# Key differences from base: 30 classes, dynamic crop-based extraction, 
# stride-1 first layer, grad accumulation, Dice-based scheduling/early-stopping
inherits: base.yaml

experiment_name: camera-ready-unet-30cls-dynamic-dice

data:
  num_classes: 30
  blueprint_json: "latest_baseline_centroids.json"
  target_type: "labels"
  rfs_weights_path: "crop_rfs_weights.json"

label_map:
  2: 1
  3: 2
  4: 3
  5: 4
  6: 5
  7: 6
  8: 7
  9: 8
  10: 9
  11: 10
  12: 11
  13: 12
  14: 13
  15: 14
  16: 15
  17: 16
  18: 17
  19: 18
  20: 19
  21: 20
  22: 21
  23: 22
  24: 23
  26: 24
  28: 25
  30: 26
  36: 27
  47: 28
  48: 29

model:
  out_channels: 30
  strides: [2, 2, 2, 2]

training:
  batch_size: 4
  # train_samples: 6400
  # val_samples: 800
  accumulation_steps: 2
  early_stop_patience: 15
  early_stop_metric: val_dice
  scheduler_mode: max
  print_freq: 200
  num_epochs: 10