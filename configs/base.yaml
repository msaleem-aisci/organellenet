# ============================================================================
# OrganelleNet — Base Configuration (Shared Defaults)
# ============================================================================
# All experiment configs inherit from this file via `inherits: base.yaml`.
# Override only the parameters that differ per experiment.

experiment_name: unnamed-experiment

paths:
  main_dir: /workspace/organellenet
  data_dir: /mnt/dataset/raw_data

data:
  patch_dim: 128
  seed: 42
  num_classes: 30
  target_type: "labels"
  blueprint_json: "latest_baseline_centroids.json"
  rfs_weights_path: str = "crop_rfs_weights.json"
  target_classes:
    - pm
    - mito_mem
    - mito_lum
    - mito_ribo
    - golgi_mem
    - golgi_lum
    - ves_mem
    - ves_lum
    - endo_mem
    - endo_lum
    - lyso_mem
    - lyso_lum
    - ld_mem
    - ld_lum
    - er_mem
    - er_lum
    - eres_mem
    - eres_lum
    - ne_mem
    - ne_lum
    - np_out
    - np_in
    - hchrom
    - echrom
    - nucpl
    - mt_out
    - mt_in
    - perox_mem
    - perox_lum

model:
  spatial_dims: 3
  in_channels: 1
  out_channels: 30
  scale_conditioned: False
  channels: [64, 128, 256, 512, 1024]
  strides: [2, 2, 2, 2]
  kernel_size: 3
  up_kernel_size: 3
  num_res_units: 2
  act: PRELU
  norm: INSTANCE

training:
  batch_size: 4
  lr: 0.0001
  weight_decay: 0.00001
  num_epochs: 1000
  scheduler_patience: 5
  scheduler_factor: 0.5
  scheduler_mode: min
  early_stop_patience: 12
  early_stop_metric: val_dice
  loss_type: "dice_ce"
  accumulation_steps: 1
  print_freq: 1
  num_workers: 2
  class_weights: null   # null = use defaults from config.py

augmentation:
  enabled: False
  flip: True
  rotate90: True
  intensity_scale_range: [0.8, 1.2]
  intensity_shift_range: [-0.1, 0.1]
  gaussian_noise_std: 0.03
  gamma_range: [0.7, 1.5]
  elastic_enabled: True
  elastic_alpha: 80.0
  elastic_sigma: 10.0
  elastic_prob: 0.3