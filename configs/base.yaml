# ============================================================================
# OrganelleNet — Base Configuration (Shared Defaults)
# ============================================================================
# All experiment configs inherit from this file via `inherits: base.yaml`.
# Override only the parameters that differ per experiment.

experiment_name: unnamed-experiment

paths:
  main_dir: /kaggle/working/organellenet
  data_dir: /kaggle/working/organellenet/data

data:
  patch_dim: 128
  max_jitter: 48
  seed: 42
  num_classes: 30          # Background (0) + 29 atomic semantic classes (1..29)
  target_classes:
    - pm
    - mito_mem
    - mito_lum
    - mito_ribo
    - golgi_mem
    - golgi_lum
    - ves_mem
    - ves_lum
    - endo_mem
    - endo_lum
    - lyso_mem
    - lyso_lum
    - ld_mem
    - ld_lum
    - er_mem
    - er_lum
    - eres_mem
    - eres_lum
    - ne_mem
    - ne_lum
    - np_out
    - np_in
    - hchrom
    - echrom
    - nucpl
    - mt_out
    - mt_in
    - perox_mem
    - perox_lum
  train_json: train_anchore.json
  val_json: val_anchore.json
  test_json: test_anchore.json

model:
  spatial_dims: 3
  in_channels: 1
  out_channels: 13
  channels: [64, 128, 256, 512, 1024]
  strides: [2, 2, 2, 2]
  kernel_size: 3
  up_kernel_size: 3
  num_res_units: 2
  act: PRELU
  norm: INSTANCE

training:
  batch_size: 4
  lr: 0.0001
  weight_decay: 0.00001
  num_epochs: 1000
  scheduler_patience: 5
  scheduler_factor: 0.5
  scheduler_mode: min
  early_stop_patience: 12
  early_stop_metric: val_dice
  accumulation_steps: 1
  print_freq: 1
  num_workers: 2
  class_weights: null   # null = use defaults from config.py
